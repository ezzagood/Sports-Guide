      name: Daily Sports Schedule Update

on:
  schedule:
    # Runs every day at 00:00 UTC (10:00 AM AEST / 11:00 AM AEDT)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Schedule Fetcher Script
        run: python update_schedule.py

      - name: Commit and Push Updated Schedule
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add schedule.json
          git commit -m "Auto-update sports listings for 3 days ahead" || exit 0
          git push

